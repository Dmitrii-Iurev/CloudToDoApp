name: frontend

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # pas aan naar de gewenste Node-versie

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      # Optionele teststappen
      # - name: Run unit tests
      #   run: npm test -- --code-coverage --browsers=ChromeHeadless
      #   working-directory: ./frontend

      # - name: Report code coverage
      #   uses: mridang/action-test-reporter@v1
      #   with:
      #     github-token: ${{ secrets.GH_TOKEN }}
      #     coverage-file: ./frontend/coverage/clover.xml
      #     working-directory: ./frontend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: dmitrii0511iurev/fe:latest
